quarkus.http.ssl-port=8081
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.client-auth=request

quarkus.tls.key-store.pem.0.cert=/run/secrets/tls_cert
quarkus.tls.key-store.pem.0.key=/run/secrets/tls_key
quarkus.tls.trust-store.pem.certs=/run/secrets/tls_ca

%dev.quarkus.tls.key-store.pem.0.cert=../secrets/tls/clients.crt
%dev.quarkus.tls.key-store.pem.0.key=../secrets/tls/clients.key
%dev.quarkus.tls.trust-store.pem.certs=../secrets/tls/ca.crt

quarkus.smallrye-jwt.priority=2000

quarkus.http.auth.proactive=false

%dev.quarkus.mongodb.connection-string=mongodb://admin:admin123@localhost:27017
quarkus.mongodb.database=clientdb

%dev.mp.jwt.verify.publickey.location=file:./src/main/resources/publicKey.pem
mp.jwt.verify.issuer=https://benito-ventas.app







