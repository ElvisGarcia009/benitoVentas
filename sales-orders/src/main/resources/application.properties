quarkus.http.ssl-port=8084
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.client-auth=request

quarkus.tls.key-store.pem.0.cert=/run/secrets/tls_cert
quarkus.tls.key-store.pem.0.key=/run/secrets/tls_key
quarkus.tls.trust-store.pem.certs=/run/secrets/tls_ca

kafka.security.protocol=SSL
%dev.kafka.security.protocol=PLAINTEXT
kafka.ssl.keystore.type=PEM
kafka.ssl.keystore.location=/run/secrets/tls_kafka_pem
kafka.ssl.truststore.type=PEM
kafka.ssl.truststore.location=/run/secrets/tls_ca

%dev.quarkus.tls.key-store.pem.0.cert=../secrets/tls/orders.crt
%dev.quarkus.tls.key-store.pem.0.key=../secrets/tls/orders.key
%dev.quarkus.tls.trust-store.pem.certs=../secrets/tls/ca.crt

quarkus.tls.internal.key-store.pem.0.cert=/run/secrets/tls_cert
quarkus.tls.internal.key-store.pem.0.key=/run/secrets/tls_key
quarkus.tls.internal.trust-store.pem.certs=/run/secrets/tls_ca

%dev.quarkus.tls.internal.key-store.pem.0.cert=../secrets/tls/orders.crt
%dev.quarkus.tls.internal.key-store.pem.0.key=../secrets/tls/orders.key
%dev.quarkus.tls.internal.trust-store.pem.certs=../secrets/tls/ca.crt

quarkus.rest-client.product-api.tls-configuration-name=internal
quarkus.rest-client.client-api.tls-configuration-name=internal
quarkus.rest-client.auth-api.tls-configuration-name=internal

quarkus.smallrye-jwt.priority=2000

quarkus.http.auth.proactive=false


%dev.quarkus.mongodb.connection-string=mongodb://admin:admin123@localhost:27017
quarkus.mongodb.database=ordersdb

%dev.quarkus.rest-client.product-api.url=https://localhost:8080
%dev.quarkus.rest-client.client-api.url=https://localhost:8081
%dev.quarkus.rest-client.auth-api.url=https://localhost:8083
%dev.orders.service.secret=dev-orders-secret

quarkus.rest-client.connect-timeout=2000
quarkus.rest-client.read-timeout= 5000

%dev.mp.jwt.verify.publickey.location=file:./src/main/resources/publicKey.pem
mp.jwt.verify.issuer=https://benito-ventas.app

# KAFKA
%dev.kafka.bootstrap.servers=localhost:9092
quarkus.kafka.health.enabled=true

mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=order-requests

mp.messaging.incoming.orders-in.connector=smallrye-kafka
mp.messaging.incoming.orders-in.topic=order-requests
mp.messaging.incoming.orders-in.group.id=orders-processor
mp.messaging.incoming.orders-in.auto.offset.reset=earliest
mp.messaging.incoming.orders-in.failure-strategy=dead-letter-queue

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.info-title=sales-orders API