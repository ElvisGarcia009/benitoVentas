services:
  mongodb:
    image: mongo:7
    container_name: mongo-sales
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
  sales-products:
    build:
      context: ./sales-products
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sales-product
    ports:
      - "9080:8443"
    secrets:
      - jwt_public_key
      - source: tls_ca
        target: tls_ca
      - source: products_cert
        target: tls_cert
      - source: products_key
        target: tls_key
    environment:
      QUARKUS_HTTP_SSL_PORT: 8443
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://admin:admin123@mongodb:27017
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /run/secrets/jwt_public_key
    depends_on:
      - mongodb
  sales-clients:
    build:
      context: ./sales-clients
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sales-clients
    ports:
      - "9081:8443"
    secrets:
      - jwt_public_key
      - source: tls_ca
        target: tls_ca
      - source: clients_cert
        target: tls_cert
      - source: clients_key
        target: tls_key
    environment:
      QUARKUS_HTTP_SSL_PORT: 8443
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://admin:admin123@mongodb:27017
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /run/secrets/jwt_public_key
    depends_on:
      - mongodb
  sales-orders:
    build:
      context: ./sales-orders
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sales-orders
    ports:
      - "9082:8443"
    secrets:
      - jwt_public_key
      - source: tls_ca
        target: tls_ca
      - source: orders_cert
        target: tls_cert
      - source: orders_key
        target: tls_key
    environment:
      QUARKUS_HTTP_SSL_PORT: 8443
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://admin:admin123@mongodb:27017
      QUARKUS_REST_CLIENT_PRODUCT_API_URL: https://sales-products:8443
      QUARKUS_REST_CLIENT_CLIENT_API_URL: https://sales-clients:8443
      QUARKUS_REST_CLIENT_AUTH_API_URL: https://sales-auth:8443
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDERS_SERVICE_SECRET: ${ORDERS_SERVICE_SECRET:-OrderService1994*}
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /run/secrets/jwt_public_key
    depends_on:
      - mongodb
      - kafka
      - sales-clients
      - sales-products
      - sales-auth
  sales-auth:
    build:
      context: ./sales-auth
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: sales-auth
    ports:
      - "9083:8443"
    secrets:
      - jwt_private_key
      - jwt_public_key
      - source: tls_ca
        target: tls_ca
      - source: auth_cert
        target: tls_cert
      - source: auth_key
        target: tls_key
    environment:
      QUARKUS_HTTP_SSL_PORT: 8443
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://admin:admin123@mongodb:27017
      USER_SEEDER_ADMINPASSWORD: Admin123$
      QUARKUS_REST_CLIENT_CLIENT_API_URL: https://sales-clients:8443
      SMALLRYE_JWT_SIGN_KEY_LOCATION: /run/secrets/jwt_private_key
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /run/secrets/jwt_public_key
      ORDERS_SERVICE_SECRET: ${ORDERS_SERVICE_SECRET:-OrderService1994*}
    depends_on:
      - mongodb
      - sales-clients
volumes:
  mongo-data:
secrets:
    jwt_private_key:
      file: ./secrets/privateKey.pem
    jwt_public_key:
      file: ./secrets/publicKey.pem
    tls_ca:
      file: ./secrets/tls/ca.crt
    products_cert:
      file: ./secrets/tls/products.crt
    products_key:
      file: ./secrets/tls/products.key
    clients_cert:
      file: ./secrets/tls/clients.crt
    clients_key:
      file: ./secrets/tls/clients.key
    orders_cert:
      file: ./secrets/tls/orders.crt
    orders_key:
      file: ./secrets/tls/orders.key
    auth_cert:
      file: ./secrets/tls/auth.crt
    auth_key:
      file: ./secrets/tls/auth.key