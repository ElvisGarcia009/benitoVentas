%dev.user.seeder.adminPassword=Admin123$

quarkus.http.ssl-port=8083
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.client-auth=request

quarkus.tls.key-store.pem.0.cert=/run/secrets/tls_cert
quarkus.tls.key-store.pem.0.key=/run/secrets/tls_key
quarkus.tls.trust-store.pem.certs=/run/secrets/tls_ca

%dev.quarkus.tls.key-store.pem.0.cert=../secrets/tls/auth.crt
%dev.quarkus.tls.key-store.pem.0.key=../secrets/tls/auth.key
%dev.quarkus.tls.trust-store.pem.certs=../secrets/tls/ca.crt

quarkus.tls.internal.key-store.pem.0.cert=/run/secrets/tls_cert
quarkus.tls.internal.key-store.pem.0.key=/run/secrets/tls_key
quarkus.tls.internal.trust-store.pem.certs=/run/secrets/tls_ca

%dev.quarkus.tls.internal.key-store.pem.0.cert=../secrets/tls/auth.crt
%dev.quarkus.tls.internal.key-store.pem.0.key=../secrets/tls/auth.key
%dev.quarkus.tls.internal.trust-store.pem.certs=../secrets/tls/ca.crt

quarkus.rest-client.client-api.tls-configuration-name=internal

quarkus.smallrye-jwt.priority=2000

quarkus.http.auth.proactive=false

%dev.quarkus.mongodb.connection-string=mongodb://admin:admin123@localhost:27017
quarkus.mongodb.database=userdb

%dev.smallrye.jwt.sign.key.location=file:../secrets/privateKey.pem
smallrye.jwt.new-token.issuer=https://benito-ventas.app

%dev.mp.jwt.verify.publickey.location=file:./src/main/resources/publicKey.pem

mp.jwt.verify.issuer=https://benito-ventas.app

%dev.quarkus.rest-client.client-api.url=https://localhost:8081
quarkus.rest-client.client-api.connect-timeout=2000
quarkus.rest-client.client-api.read-timeout=5000

%dev.orders.service.secret=dev-orders-secret



# burst protection
quarkus.rate-limiter.buckets.authentication.limits[0].permitted-uses=10
quarkus.rate-limiter.buckets.authentication.limits[0].period=1S
# fair use
quarkus.rate-limiter.buckets.authentication.limits[1].permitted-uses=100
quarkus.rate-limiter.buckets.authentication.limits[1].period=5M
quarkus.rate-limiter.buckets.authentication.shared=true
