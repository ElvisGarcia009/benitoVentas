quarkus.http.port=8080
quarkus.http.auth.proactive=false


%dev.quarkus.mongodb.connection-string=mongodb://admin:admin123@localhost:27017
quarkus.mongodb.database=productdb


%dev.mp.jwt.verify.publickey.location=file:./src/main/resources/publicKey.pem
mp.jwt.verify.issuer=https://benito-ventas.app


# burst protection
quarkus.rate-limiter.buckets.unauthenticatedResource.limits[0].permitted-uses=10
quarkus.rate-limiter.buckets.unauthenticatedResource.limits[0].period=1S
# fair use
quarkus.rate-limiter.buckets.unauthenticatedResource.limits[1].permitted-uses=100
quarkus.rate-limiter.buckets.unauthenticatedResource.limits[1].period=5M
quarkus.rate-limiter.buckets.unauthenticatedResource.shared=true



